name: Daily Slack digest

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 09:00 Malaysia, weekdays only
    - cron: '0 6 * * 1-5'    # 14:00 Malaysia — only speaks up if something new
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or afternoon'
        default: 'morning'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg
      - name: Send digest
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * 1-5" ]; then
            node sync/digest.js afternoon
          else
            node sync/digest.js ${{ github.event.inputs.mode || 'morning' }}
          fi
